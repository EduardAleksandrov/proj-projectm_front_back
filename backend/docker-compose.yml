version: '3.7'  # Specify the Docker Compose version

x-app-args: &app-args
  - USER=${USER}

networks:
  projectm:
    external: true  # Указываем, что это внешняя сеть

volumes:
  baseservice_postgresql-vl:
  portainer_data:
  rabbitmq_data:

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer # username:admin, password: 123123123123
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    ports:
      - "9000:9000"
      - "9443:9443"
    networks:
      - projectm

  projectm_nginx:
    image: nginx:1.29.4
    container_name: nginx_service
    restart: unless-stopped
    ports:
      - 80:80
    volumes:
      - ./Nginx/nginx-conf/${NGINXFILE}:/etc/nginx/conf.d/default.conf
    networks:
      - projectm

  rabbitmq:
    image: rabbitmq:4.1.3-management
    container_name: rabbitmq_service
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: "admin"
      RABBITMQ_DEFAULT_PASS: "password"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  projectm_apigateway_service:
    container_name: apigateway_service
    build:
      context: .  # Current directory
      dockerfile: docker/ApiGateway.Dockerfile  # The Dockerfile to use
    restart: unless-stopped
    ports:
      - "5000:5000"  # Map port 5000 on host to port 80 on container
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"  # Set the environment variable
      ASPNETCORE_URLS: "http://apigateway_service:5000"
    networks:
      - projectm

  projectm_baseservice_service:
    container_name: baseservice_service
    build:
      context: .  # Current directory where docker-compose.yml file
      dockerfile: ${DOCFILEBASESERVICE}  # The Dockerfile to use
    restart: unless-stopped
    ports:
      - "8080:80"  # Map port 5000 on host to port 80 on container
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETENV}  # Set the environment variable
      ASPNETCORE_URLS: "http://baseservice_service:80"
      DB_CONNECTION_STRING: ${DB_CONNECTION_STRING}
    env_file:
      - .env  # Все переменные из файла станут доступны в этом контейнере
    volumes:
      - ../files:/app/wwwroot  #! Монтируем статическую папку
    user: "1000:1000" #! Запускаем с такимже пользователем UID (User Identifier) и GID (Group Identifier) как и хост для папки files нужно
    networks:
      - projectm
    depends_on:
      - projectm_baseservice_postgresql

  projectm_baseservice_postgresql:
    image: postgres:18
    container_name: baseservice_postgresql #host for pgadmin
    restart: unless-stopped
    ports:
      - 5432:5432
    volumes:
      - baseservice_postgresql-vl:/var/lib/postgresql/data
      - ./BaseServiceDb/db-init_dump.sql:/docker-entrypoint-initdb.d/init_db.sql
    environment:
      POSTGRES_DB: "base-db"
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "password"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    networks:
      - projectm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d base-db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s